[package]
name = "queenx-host-tests"
version = "0.1.0"
edition = "2024"
description = "QueenX host-side tests + microbenchmarks"
authors = ["Anfer"]

# 集成测试 (integration tests) 由 Cargo 自动从 tests/ 目录发现
# 完整索引见 host-tests/README.md §测试分类索引
# 命名规范: <scope>_<feature>_<kind>_test.rs
#
# 单元测试 (unit tests) 内联于 src/*.rs 的 #[cfg(test)] mod tests:
# - src/dma_stream.rs  — DMA 状态机 + 校验
#
# H-04 (2026-09-09): src/buddy.rs 平行实现已删除, buddy 测试移至
# tests/pmm_buddy_host_test.rs (经 MetaStore 注入 VecMetaStore 驱动内核 pmm).
#
# 性能基准 (binary, 通过 bin/ 入口运行):
# - src/bin/framekernel_bench.rs 调用 lib::framekernel_bench::run_all() 输出 JSON

[[bin]]
name = "framekernel-bench"
path = "src/bin/framekernel_bench.rs"

[dependencies]
bitflags = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# B08-12 (DECISION-052 路线 C): 直接引用内核 services 真实源码 (host-test feature),
# 消除 host-tests/src/ 下 7 处平行实现 (hvfs/dma_stream/buddy/capability/checksum/sha256/framekernel_bench).
# host-tests 为根 crate, 其 dev profile (panic=unwind) 覆盖 queenx 依赖的 panic 策略.
queenx = { path = "../src/rust", features = ["host-test"] }
