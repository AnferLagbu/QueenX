name: QueenX CI

on:
  workflow_run:
    workflows: ["CI x86_64", "CI aarch64", "CI Lint"]
    types: [completed]

jobs:
  # ========================================================================
  # 框内核合规性总报告
  # ========================================================================
  framekernel-compliance:
    name: 框内核合规性总报告
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查各工作流状态
        run: |
          echo "=== 框内核合规性检查 ==="
          echo "触发工作流: ${{ github.event.workflow_run.name }}"
          echo "工作流结论: ${{ github.event.workflow_run.conclusion }}"
          echo ""
          echo "各工作流状态:"
          echo "  - CI x86_64: cargo check + clippy + host-tests + 内核 host 单测 (§2.3-6)"
          echo "  - CI aarch64: cargo check"
          echo "  - CI Lint: SAFETY 审计 + 边界检查 + 死锁检测 + 注释语言"
          echo ""
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "✅ 触发工作流通过"
          else
            echo "❌ 触发工作流失败: ${{ github.event.workflow_run.conclusion }}"
            exit 1
          fi

      - name: 生成合规性报告
        if: success()
        run: |
          cat <<'EOF' > $GITHUB_STEP_SUMMARY
          # QueenX 框内核合规性报告

          | 工作流 | 状态 | 内容 |
          |--------|------|------|
          | CI x86_64 | ✅ | cargo check + clippy + host-tests + 内核 host 单测 |
          | CI aarch64 | ✅ | cargo check |
          | CI Lint | ✅ | SAFETY 审计 + 边界检查 + 死锁检测 |

          > 各工作流独立运行, 任一失败将阻断合并.
          EOF
