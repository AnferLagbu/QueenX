name: CI Bench

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========================================================================
  # Job 1: 性能基准测试 + 回归检查
  # ========================================================================
  benchmark:
    name: 性能基准测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host-tests/target
          key: ${{ runner.os }}-bench-${{ hashFiles('host-tests/Cargo.toml', 'host-tests/Cargo.lock') }}

      - name: 检查 baseline.json 是否存在
        id: check-baseline
        run: |
          if [ -f host-tests/benches/baseline.json ]; then
            echo "has_baseline=true" >> $GITHUB_OUTPUT
          else
            echo "has_baseline=false" >> $GITHUB_OUTPUT
          fi

      - name: 记录初始基线 (首次)
        if: steps.check-baseline.outputs.has_baseline == 'false'
        run: |
          echo "baseline.json 不存在, 自动记录初始基线..."
          python3 scripts/record_bench_baseline.py 2>&1 | tee build/log/bench_baseline_init.txt
          echo "已生成 baseline.json, 后续将进入回归检查模式"

      - name: 运行回归检查
        if: steps.check-baseline.outputs.has_baseline == 'true'
        run: |
          python3 scripts/check_bench_regression.py 2>&1 | tee build/log/bench_regression.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::bench 回归检查失败"
            cat build/log/bench_regression.txt
            exit 1
          fi
          echo "✅ bench 回归检查通过"

      - name: 上传基准报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            build/log/bench_regression.txt
            build/log/bench_baseline_init.txt
            host-tests/benches/baseline.json
          retention-days: 30

  # ========================================================================
  # Job 2: 编译时间基准 (跟踪编译性能退化)
  # ========================================================================
  compile-time:
    name: 编译时间基准
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-none
          components: rust-src

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-compile-time-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: 测量编译时间
        working-directory: src/rust
        run: |
          echo "=== 编译时间测量 (x86_64) ==="
          START=$(date +%s%N)
          # 方案 D: 裸机 build 指向 kernel manifest; 方案 B: 注入 build-std
          cargo build --manifest-path ../kernel/Cargo.toml --release --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target x86_64-unknown-none --target-dir target 2>&1 | tail -3
          END=$(date +%s%N)
          DURATION=$(( (END - START) / 1000000 ))
          echo "编译时间: ${DURATION}ms"
          echo "compile_time_ms=${DURATION}" >> $GITHUB_ENV

      - name: 记录编译时间
        run: |
          echo "| 架构 | 编译时间 (ms) | 日期 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64 | ${{ env.compile_time_ms }} | $(date -u +%Y-%m-%d) |" >> $GITHUB_STEP_SUMMARY
