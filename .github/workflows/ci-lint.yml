name: CI Lint

on:
  push:
    branches: [main, master, develop, feature/**]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ========================================================================
  # Job 1: SAFETY 注释 + unsafe 分布审计
  # ========================================================================
  audit-unsafe:
    name: SAFETY 注释 + unsafe 分布审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 SAFETY 注释审计
        run: |
          mkdir -p build/log
          echo "=== Step 1: SAFETY 注释审计 (M6.1) ==="
          # B01-25 模式: 捕获脚本真实退出码, 修复 `| tee` fail-open (管道退出码 = tee 的 0).
          set +e
          SAFETY_OUT=$(python3 scripts/audit_safety_coverage.py --missing-only 2>&1)
          SAFETY_RC=$?
          set -e
          echo "$SAFETY_OUT" | tee build/log/safety_audit.txt
          if [ "$SAFETY_RC" -ne 0 ]; then
            echo "::error::SAFETY 注释审计失败 (存在未覆盖的 unsafe 块), 请为每个 unsafe 块补充 // SAFETY: 注释"
            echo "--- 缺失 SAFETY 的 unsafe 位置 (前 20) ---"
            echo "$SAFETY_OUT" | head -20
            exit 1
          fi
          echo "✅ SAFETY 注释审计通过 (framework 全部 unsafe 块均有 SAFETY 注释)"
          echo ""
          echo "=== Step 2: services→framework 边界渗透检查 (M6.3) ==="
          # B01-25 模式同上 (B01-03: HIGH 必阻断).
          set +e
          BOUNDARY_OUT=$(python3 scripts/audit_services_boundary.py 2>&1)
          BOUNDARY_RC=$?
          set -e
          echo "$BOUNDARY_OUT" | tee build/log/services_boundary.txt | tail -20
          if [ "$BOUNDARY_RC" -ne 0 ]; then
            echo "::error::services→framework 边界渗透检查失败 (CRITICAL/HIGH 违规)"
            echo "--- 违规详情 ---"
            grep -A 4 'FORBIDDEN\|RAW_POINTER\|CRITICAL\|HIGH' build/log/services_boundary.txt | head -40
            exit 1
          fi
          echo "✅ 边界渗透检查通过 (services 无 framework 内部模块穿透)"
          echo ""
          echo "=== Step 3: 死锁检测矩阵 (M6.2) ==="
          # B01-25 模式: 依赖脚本退出码 (CRITICAL > 0 时 exit 1).
          set +e
          DEADLOCK_OUT=$(python3 scripts/audit_deadlock_matrix.py 2>&1)
          DEADLOCK_RC=$?
          set -e
          echo "$DEADLOCK_OUT" | tee build/log/deadlock_matrix.txt | tail -20
          if [ "$DEADLOCK_RC" -ne 0 ]; then
            echo "::error::检测到 CRITICAL 级别死锁风险, 请修复"
            exit 1
          fi

      - name: 上传审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            build/log/safety_audit.txt
            build/log/services_boundary.txt
            build/log/deadlock_matrix.txt
            target/audit/services-boundary.json
          retention-days: 30

  # ========================================================================
  # Job 2: services 层 unsafe 字符串扫描 (强约束)
  # ========================================================================
  services-no-unsafe:
    name: services 层 0 unsafe 扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 扫描 services/ 中 unsafe 关键字 (Python 智能过滤注释)
        run: |
          python3 <<'PYEOF'
          import re, sys
          from pathlib import Path
          issues = []
          for f in Path('src/kernel/services').rglob('*.rs'):
              for ln, line in enumerate(f.read_text(errors='replace').splitlines(), 1):
                  stripped = line.strip()
                  if stripped.startswith('//') or stripped.startswith('*') or stripped.startswith('/*'):
                      continue
                  if re.search(r'\bunsafe\s*\{', line):
                      issues.append(f'{f}:{ln}: unsafe {{ block: {line.strip()[:80]}')
                  elif re.search(r'\bunsafe\s+fn\b', line):
                      issues.append(f'{f}:{ln}: unsafe fn: {line.strip()[:80]}')
                  elif re.search(r'\bunsafe\s+impl\b', line):
                      issues.append(f'{f}:{ln}: unsafe impl: {line.strip()[:80]}')
                  elif re.search(r'\bunsafe\s+trait\b', line):
                      issues.append(f'{f}:{ln}: unsafe trait: {line.strip()[:80]}')
          if issues:
              for i in issues: print('  ' + i)
              print('FAIL: unsafe found in services/')
              sys.exit(1)
          print('PASS: services/ 0 unsafe')
          PYEOF

  # ========================================================================
  # Job 3: 注释语言一致性审计
  # ========================================================================
  comment-language:
    name: 注释语言一致性审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行注释语言审计
        run: |
          AUDIT_OUT=$(python3 scripts/audit_comment_language.py 2>&1 || true)
          echo "$AUDIT_OUT"
          if echo "$AUDIT_OUT" | grep -q "PASSED"; then
            echo "✅ 注释中文化 100% 完成 (0 违规)"
          else
            echo "::error::英文段落注释残留 (硬阈值, 阻断 CI)"
            exit 1
          fi

  # ========================================================================
  # Job 4: C 风格命名残留审计
  # ========================================================================
  c-naming:
    name: C 风格命名残留审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 C 命名审计
        run: |
          if python3 scripts/audit_c_naming.py 2>&1 | tail -8; then
            echo "✅ 0 C 风格类型后缀, kmalloc/kfree 仅限 extern \"C\""
          else
            echo "::error::有 C 风格命名残留"
            exit 1
          fi

  # ========================================================================
  # Job 5: 块设备抽象统一性审计
  # ========================================================================
  block-registration:
    name: 块设备抽象统一性审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行块设备审计
        run: |
          if python3 scripts/audit_block_registration.py 2>&1 | tail -10; then
            echo "✅ 块设备驱动统一通过 proto_block::register_block_device"
          else
            echo "::error::有块设备驱动绕过 proto_block 桥接"
            exit 1
          fi

  # ========================================================================
  # Job 6: services OnceCell 单一抽象审计
  # ========================================================================
  once-cell:
    name: services OnceCell 单一抽象审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 OnceCell 审计
        run: |
          if python3 scripts/audit_once_cell.py 2>&1 | tail -8; then
            echo "✅ services 统一通过 sync::once::OnceCell"
          else
            echo "::error::有 services 模块绕过 OnceCell 抽象"
            exit 1
          fi

  # ========================================================================
  # Job 7: rustdoc 文档质量检查 (P1-I-30)
  # ========================================================================
  rustdoc-check:
    name: rustdoc 0 warnings 阻断
    runs-on: ubuntu-latest
    needs: audit-unsafe
    steps:
      - uses: actions/checkout@v4

      - name: Rust nightly 工具链安装
        uses: dtolnay/rust-toolchain@nightly

      - name: 添加 rust-src + rustfmt 组件
        run: rustup component add rust-src rustfmt

      - name: 双架构 rustdoc --no-deps 阻断 (0 源码 warnings)
        run: |
          set -e
          echo "=== rustdoc --no-deps 阻断检查 ==="
          echo "策略: 阻断 broken_intra_doc_links (源码级 link 错误),"
          echo "      不阻断 rustdoc 内部 HTML tag 自动生成警告 (无源码位置)."
          cd src/rust
          # x86_64
          # 方案 D: 裸机 doc 指向 kernel manifest; 方案 B: 注入 build-std
          RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc --release \
            --manifest-path ../kernel/Cargo.toml \
            --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' \
            --target x86_64-unknown-none --target-dir target \
            --lib --bins --examples --no-deps 2>&1 | tee /tmp/rustdoc-x86.log | tail -5
          DOC_EXIT_X86=${PIPESTATUS[0]}
          # aarch64
          # 方案 D: 裸机 doc 指向 kernel manifest; 方案 B: 注入 build-std
          RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc --release \
            --manifest-path ../kernel/Cargo.toml \
            --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' \
            --target aarch64-unknown-none-softfloat --target-dir target \
            --lib --bins --examples --no-deps 2>&1 | tee /tmp/rustdoc-aarch64.log | tail -5
          DOC_EXIT_ARM=${PIPESTATUS[0]}
          echo ""
          echo "x86_64 rustdoc exit: $DOC_EXIT_X86"
          echo "aarch64 rustdoc exit: $DOC_EXIT_ARM"
          if [ "$DOC_EXIT_X86" -ne 0 ] || [ "$DOC_EXIT_ARM" -ne 0 ]; then
            echo "::error::rustdoc broken_intra_doc_links 已变为非 0, 修复后再提交"
            echo "--- x86_64 ---"
            tail -30 /tmp/rustdoc-x86.log
            echo "--- aarch64 ---"
            tail -30 /tmp/rustdoc-aarch64.log
            exit 1
          fi
          echo "✅ rustdoc --no-deps 源码级 link 0 错误 (x86_64 + aarch64)"

  # ========================================================================
  # Job 8: audit_coupling 模块耦合度审计 (B01-18 接入 CI)
  # ========================================================================
  audit-coupling:
    name: 模块耦合度审计 (F3 跨子系统耦合)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行耦合度审计
        run: |
          mkdir -p build/log
          # B01-25: 移除 `|| true` 掩盖退出码的 fail-open bug (与 audit-invariants job 同模式).
          set +e
          COUPLING_OUT=$(python3 scripts/audit_coupling.py 2>&1)
          COUPLING_RC=$?
          set -e
          echo "$COUPLING_OUT" | tee build/log/audit_coupling.txt | tail -20
          # B01-18: 退出码语义 (HIGH/severe_circular > 0 时 fail)
          if [ "$COUPLING_RC" -ne 0 ]; then
            echo "::error::模块耦合度审计失败 (HIGH 跨子系统访问 / 严重循环依赖)"
            echo "--- Top 跨子系统访问 ---"
            grep -A 3 'HIGH' build/log/audit_coupling.txt | head -20
            exit 1
          fi
          echo "✅ 模块耦合度审计通过 (无严重循环 / 无跨子系统访问)"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupling-audit-report
          path: build/log/audit_coupling.txt
          retention-days: 14

  # ========================================================================
  # Job 9: audit_invariants 6 条安全不变式审计 (B01-18 接入 CI)
  # ========================================================================
  audit-invariants:
    name: 6 条安全不变式审计 (I1-I6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行 6 条安全不变式审计
        run: |
          mkdir -p build/log
          # B01-25: 移除 `|| true` 掩盖退出码的 fail-open bug.
          # 原写法 `$(python3 ... || true)` 使命令替换的退出码恒为 0,
          # 后续 ${PIPESTATUS[0]} 恒为 0, CI 永不因违规失败.
          set +e
          INVARIANTS_OUT=$(python3 scripts/audit_invariants.py 2>&1)
          INVARIANTS_RC=$?
          set -e
          echo "$INVARIANTS_OUT" | tee build/log/audit_invariants.txt | tail -12
          # B01-18: 退出码语义 (total_violations > 0 时 fail)
          if [ "$INVARIANTS_RC" -ne 0 ]; then
            echo "::error::6 条安全不变式存在违反"
            echo "--- 违规详情 ---"
            grep -A 1 '^  ✗' build/log/audit_invariants.txt | head -20
            exit 1
          fi
          echo "✅ 6 条安全不变式全部满足"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariants-audit-report
          path: build/log/audit_invariants.txt
          retention-days: 14

  # ========================================================================
  # Job 10: audit-selftest 审计脚本自测 (B01-24 返工接入 CI)
  # ========================================================================
  audit-selftest:
    name: 审计脚本自测 (B01-24 负测试 4 脚本)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.x 安装
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行审计脚本自测
        run: |
          mkdir -p build/log
          SELFTEST_OUT=$(python3 scripts/tests/audit_selftest.py 2>&1 || true)
          echo "$SELFTEST_OUT" | tee build/log/audit_selftest.txt | tail -30
          # B01-24: 自测退出码 (4/4 全部通过才成功)
          SELFTEST_RC=${PIPESTATUS[0]}
          if [ "$SELFTEST_RC" -ne 0 ]; then
            echo "::error::审计脚本自测失败 (负测试未全部拦截违规样例)"
            exit 1
          fi
          echo "✅ 审计脚本自测 4/4 通过"

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-selftest-report
          path: build/log/audit_selftest.txt
          retention-days: 14
