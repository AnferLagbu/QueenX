name: CI aarch64

on:
  push:
    branches: [main, master, develop, feature/**]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ========================================================================
  # Job 1: cargo check (aarch64)
  # ========================================================================
  cargo-check-aarch64:
    name: cargo check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + aarch64 target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-none-softfloat
          components: rust-src

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('src/rust/Cargo.toml', 'src/rust/Cargo.lock') }}

      - name: cargo check
        working-directory: src/rust
        run: |
          # 方案 D: 裸机 check 指向 kernel manifest; 方案 B: 注入 build-std
          cargo check --manifest-path ../kernel/Cargo.toml --config 'unstable.build-std=["core","compiler_builtins","alloc"]' --config 'unstable.build-std-features=["compiler-builtins-mem"]' --target aarch64-unknown-none-softfloat --target-dir target 2>&1 | tee build/log/cargo_check_aarch64.txt
          if grep -q "error\[" build/log/cargo_check_aarch64.txt; then
            echo "::error::cargo check 失败"
            exit 1
          fi

  # ========================================================================
  # Job 2: aarch64 QEMU boot test
  # ========================================================================
  qemu-boot-aarch64:
    name: QEMU boot test (aarch64)
    runs-on: ubuntu-latest
    needs: cargo-check-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust nightly + aarch64 target
        uses: dtolnay/rust-toolchain@nightly
        with:
          # 内核走 softfloat (EL1 零 FP/SIMD); 用户态 (src/user) 仍用 aarch64-unknown-none
          targets: aarch64-unknown-none aarch64-unknown-none-softfloat
          components: rust-src

      - name: 安装 QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: 构建 aarch64 内核
        run: make ARCH=aarch64 all

      - name: QEMU boot test
        run: |
          bash scripts/qemu_boot_test.sh aarch64
