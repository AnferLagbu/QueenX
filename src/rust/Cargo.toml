[package]
name = "queenx"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "QueenX 自研操作系统内核壳 crate (方案 D: 内核本体独立为 kernel crate)"
repository = "https://gitee.com/AnferLagbu/QueenX"
readme = "../../README.md"
keywords = ["kernel", "os", "framekernel", "no_std"]
categories = ["os", "no-std", "embedded"]

[lib]
name = "queenx"
# B08-04: 显式声明 lib 路径, 消除 src/rust/lib.rs 空文件歧义
path = "src/lib.rs"
# 方案 D: 壳仅以 rlib 供 host-tests 引用 (re-export kernel); 裸机 staticlib 由 kernel crate 产出.
crate-type = ["rlib"]
test = false

[profile.dev]
panic = "abort"
lto = false

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

# 调试专用 profile (与 kernel/queenx 原配置一致), 用于排查深水区问题.
[profile.test-debug]
inherits = "release"
lto = false
opt-level = 0
debug = 2

[dependencies]
# 方案 D: 内核本体独立 crate (src/kernel), 本壳仅 re-export.
# spin/zerocopy/ed25519-dalek/smoltcp 等内核依赖已迁至 kernel/Cargo.toml.
kernel = { path = "../kernel" }

[features]
default = []
# e1000 真实硬件 EEPROM 读取路径 (转发至 kernel).
e1000-real-hw = ["kernel/e1000-real-hw"]
e1000-verbose = ["kernel/e1000-verbose"]
# host-test: 剥离裸机专属顶层约束, 供 host-tests 引用内核 services 真实源码 (转发至 kernel).
host-test = ["kernel/host-test"]
kernel_test = ["kernel/kernel_test"]
fault_injection = ["kernel/fault_injection"]
smp = ["kernel/smp"]
net = ["kernel/net"]
alloc = ["kernel/alloc"]
async = ["kernel/async"]
lock_stats = ["kernel/lock_stats"]
debug_mutex = ["kernel/debug_mutex"]
initramfs = ["kernel/initramfs"]
atomic_stats = ["kernel/atomic_stats"]
log = ["kernel/log"]
json_export = ["kernel/json_export"]
ipv6 = ["kernel/ipv6"]
dhcp = ["kernel/dhcp"]
http_client = ["kernel/http_client"]
mdns = ["kernel/mdns"]
mqtt = ["kernel/mqtt"]
sntp = ["kernel/sntp"]
smtp = ["kernel/smtp"]
tftp = ["kernel/tftp"]
snmp = ["kernel/snmp"]
netbios = ["kernel/netbios"]
preempt = ["kernel/preempt"]
kaslr = ["kernel/kaslr"]
barrier = ["kernel/barrier"]
debug_syscall = ["kernel/debug_syscall"]
