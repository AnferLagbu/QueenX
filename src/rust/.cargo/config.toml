[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-nostdlib",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-nostdlib",
]

# 内核 aarch64 专用目标 (等效 -neon, 使 EL1 零 FP/SIMD, 与 +neon 版本仅差
# target-feature 一项). rustflags 必须与 aarch64-unknown-none 保持一致.
# 详见 docs/plan/aarch64-kernel-fp-free.md.
[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=-nostdlib",
]

# 方案 B (构建模式显式化, 2026-09-14): 全局 build-std 已移除 — 裸机构建
# 入口 (build.sh / Makefile / audit.sh / CI yml) 显式注入
# `--config 'unstable.build-std=["core","compiler_builtins","alloc"]'`, 避免
# cwd 隐式加载 (src/rust 内 host-target 构建触发 E0152 双 alloc 冲突).
# 详见 docs/plan/framekernel-paradigm-enforcement.md §10「构建模式显式化工程」.

# G-01/G-05 (2026-09-06 用户决策委托修复): 固化 curve25519-dalek 后端为 serial.
# 背景: LLVM 22 (滚动 nightly, 2026-06-15 起) 对 curve25519-dalek 5.0.0 的
# SIMD/AVX2 后端代码生成崩溃 (rustc SIGILL, 信号 4); serial 后端全量构建+链接通过.
# 仅编译配置, 不改内核代码, 零语义风险; 官方支持 env 选择后端.
# 作用域: 本 config 仅对 src/rust 目录内裸机构建生效, host-tests 从仓库根构建
# 不加载本 config (serial env 不生效, host 正常 SIMD 无问题).
[env]
CARGO_CFG_CURVE25519_DALEK_BACKEND = "serial"
